name: Test upozornění
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          echo "topic length: ${#TOPIC}"
          curl -s -w "\nHTTP %{http_code}\n" -H "Content-Type: application/json" -d "{\"topic\":\"$TOPIC\",\"title\":\"MarketTrace: zkušební upozornění\",\"message\":\"Pokud tohle vidíte, upozornění fungují.\",\"tags\":[\"white_check_mark\"],\"priority\":4}" https://ntfy.sh/
