name: Pomalá data SEC a fundamenty

on:
  schedule:
    - cron: '27 */2 * * 1-5'    # SEC, 13F a fundamenty každé 2 hodiny
    - cron: '27 */4 * * 0,6'    # o víkendu plná aktualizace každé 4 hodiny
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

concurrency:
  group: markettrace-full-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Načíst chráněný snapshot
        run: |
          mkdir -p data
          if ! python scripts/private_data_sync.py download data; then
            echo "Soukromý snapshot zatím není dostupný; aktualizace vytvoří nový."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ověřit všechny jazykové verze rozhraní
        run: node --test tests/*.test.cjs

      - name: Stáhnout data
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/update.py

      - name: Ověřit úplnost dat
        run: python scripts/validate_data.py

      - name: Uložit data do privátního úložiště
        run: python scripts/private_data_sync.py upload data
