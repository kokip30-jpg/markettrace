name: Data SEC a nasazení webu

on:
  schedule:
    - cron: '*/5 * * * 1-5'     # pracovní dny každých 5 minut
    - cron: '17 */2 * * 0,6'    # víkend každé 2 hodiny
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: markettrace
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Načíst uložená data (větev data)
        run: |
          if git fetch -q --depth=1 origin data; then
            rm -rf data && git archive FETCH_HEAD data | tar -x
          fi
          mkdir -p data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stáhnout data (SEC, Alpaca, ČNB)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/update.py

      - name: Uložit data (větev data, jen poslední verze)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tmp=$(mktemp -d)
          cp -r data "$tmp/"
          cd "$tmp"
          git init -q -b data
          git add data
          git -c user.name="markettrace-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Data $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Druhý pokus o zveřejnění (výpadek GitHub Pages)
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
