name: Kopie klíčů do paperbota
on: workflow_dispatch
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.COPY_PAT }}
          K: ${{ secrets.ALPACA_KEY }}
          S: ${{ secrets.ALPACA_SECRET }}
          N: ${{ secrets.NTFY_TOPIC }}
        run: |
          gh secret set ALPACA_KEY -R kokip30-jpg/paperbot --body "$K"
          gh secret set ALPACA_SECRET -R kokip30-jpg/paperbot --body "$S"
          gh secret set NTFY_TOPIC -R kokip30-jpg/paperbot --body "$N"
          echo copied
