name: Kopie klíčů Alpaca do Strike
on: workflow_dispatch
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.COPY_PAT }}
          K: ${{ secrets.ALPACA_KEY }}
          S: ${{ secrets.ALPACA_SECRET }}
        run: |
          gh secret set ALPACA_KEY -R kokip30-jpg/strike --body "$K"
          gh secret set ALPACA_SECRET -R kokip30-jpg/strike --body "$S"
          echo copied
