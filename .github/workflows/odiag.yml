name: Diagnostika opcí
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.ALPACA_KEY }}
          S: ${{ secrets.ALPACA_SECRET }}
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir out; cd out
          G=$(date -u -d '+20 days' +%F); L=$(date -u -d '+45 days' +%F)
          for f in indicative opra; do
            curl -s -w "\nHTTP %{http_code}\n" -H "APCA-API-KEY-ID: $K" -H "APCA-API-SECRET-KEY: $S" \
             "https://data.alpaca.markets/v1beta1/options/snapshots/NVDA?feed=$f&type=call&expiration_date_gte=$G&expiration_date_lte=$L&limit=5" > snap_$f.txt
          done
          curl -s -w "\nHTTP %{http_code}\n" -H "APCA-API-KEY-ID: $K" -H "APCA-API-SECRET-KEY: $S" \
             "https://paper-api.alpaca.markets/v2/options/contracts?underlying_symbols=NVDA&type=call&expiration_date_gte=$G&expiration_date_lte=$L&limit=3" > contracts.txt
          git init -q -b diag; git add .; git -c user.name=bot -c user.email=bot@x commit -q -m d
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" diag
