name: Diagnostika SEC
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          {
          echo "IP: $(curl -s https://api.ipify.org)"
          for UA in "MarketTrace kokip30-jpg@users.noreply.github.com" "Pavel Koki admin@masaze-tisnov.cz" "Sample Company Name AdminContact@samplecompany.com"; do
            for U in https://www.sec.gov/files/company_tickers.json https://data.sec.gov/submissions/CIK0001045810.json https://efts.sec.gov/LATEST/search-index?q=%22NVIDIA%22 ; do
              echo "== $UA | $U"
              curl -s --compressed -o /tmp/b -w "%{http_code}\n" -H "User-Agent: $UA" -H "Accept-Encoding: gzip, deflate" "$U"
              head -c 400 /tmp/b | sed 's/<[^>]*>//g' | tr -s ' \n' ' '; echo
            done
          done
          echo "== openinsider"; curl -s -o /tmp/b -w "%{http_code}\n" -A "Mozilla/5.0" "http://openinsider.com/latest-insider-purchases-25k"; head -c 200 /tmp/b | tr -s ' \n' ' '; echo
          echo "== finnhub-like ok check github"; curl -s -o /dev/null -w "%{http_code}\n" https://api.github.com
          } > data/diag.txt 2>&1
          git config user.name markettrace-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diag.txt; git commit -q -m diag; git pull -q --rebase origin main; git push -q
